[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microscopy_colocalization"
version = "0.1.0"
description = "Colocalization analysis for microscopy images and spot-detection CSVs (channel-channel, point-point, point-channel)"
authors = [{ name = "Ella Bahry" }]
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-image>=0.18.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "tifffile>=2023.1.1",
    "h5py>=3.7.0",
    "bioio>=1.0.0",
    "bioio-ome-tiff",
    "bioio-tifffile",
    "bioio-imageio",
    "bioio-czi",
    "bioio-nd2",
    "bioio-lif",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0"]

[project.scripts]
mcoloc = "microscopy_colocalization.__main__:main"

[tool.setuptools.packages.find]
include = ["microscopy_colocalization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
